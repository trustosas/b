<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D1 Explorer POC</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    input, textarea, button {
      width: 100%;
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      box-sizing: border-box;
      font-family: inherit;
    }
    textarea { font-family: monospace; min-height: 80px; }
    button {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover { opacity: 0.9; }
    pre {
      background: #090d16;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      color: var(--accent);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <h2>Cloudflare D1 Direct POC</h2>

  <!-- Credentials -->
  <div class="card">
    <div class="grid">
      <div>
        <label>Account ID</label>
        <input type="text" id="accountId" placeholder="Cloudflare Account ID">
      </div>
      <div>
        <label>Database ID</label>
        <input type="text" id="databaseId" placeholder="D1 Database UUID">
      </div>
    </div>
    <div style="margin-top: 1rem;">
      <label>API Token (D1 Edit/Read permissions)</label>
      <input type="password" id="apiToken" placeholder="Bearer Token">
    </div>
  </div>

  <!-- Execution -->
  <div class="card">
    <label>SQL Query</label>
    <textarea id="sqlQuery" placeholder="SELECT * FROM users;"></textarea>
    <button onclick="executeD1()">Run Query</button>
  </div>

  <!-- Output -->
  <div class="card">
    <label>Results</label>
    <pre id="output">// Results will output here...</pre>
  </div>

  <script>
    async function executeD1() {
      const accountId = document.getElementById('accountId').value.trim();
      const databaseId = document.getElementById('databaseId').value.trim();
      const apiToken = document.getElementById('apiToken').value.trim();
      const sql = document.getElementById('sqlQuery').value.trim();
      const output = document.getElementById('output');

      if (!accountId || !databaseId || !apiToken || !sql) {
        output.textContent = "Error: Fill in all credentials and the SQL query.";
        return;
      }

      output.textContent = "Querying D1...";

      try {
        const res = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${databaseId}/query`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ sql })
        });

        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = "Error: " + err.message;
      }
    }
  </script>

</body>
</html>
